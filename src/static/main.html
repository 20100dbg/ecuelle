<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ecuelle</title>
<link rel="stylesheet" href="static/css/bulma.min.css">
<link rel="stylesheet" href="static/css/style.css">
<link rel="icon" href="static/favicon.ico">
</head>
<body>

<nav class="navbar has-background-primary-10" role="navigation" aria-label="main navigation">
    
    <div class="navbar-brand">
        <!-- navbar items, navbar burger... -->
    </div>
    <div id="navbarBasicExample" class="navbar-menu">
        <div class="navbar-start">
    
          <div class="navbar-item">
            <div class="buttons">
              <a class="button is-primary">Clear</a>
              <a class="button is-primary">Reverse order</a>
            </div>
          </div>
        </div>
    </div>

    <div class="navbar-end">
      <div class="navbar-item">
        <div class="buttons">
            <p>State</p>
            <p>Nb query</p>
        </div>
      </div>
  </div>

</nav>

<div id="app" class="container">

    <div class="connection" v-if="Object.keys(connection).length > 0">{{connection}}</div>

    <div class="table-container">
        <table class="table is-fullwidth is-bordered">
            <tbody>
                <template v-for="query in queries">
                    <tr>
                        <td>
                            {{query.query}}
                            <p class="error" v-if="query.error">{{query.error}}</p>
                            <p class="error" v-if="query.app_error">Error while parsing results :(</p>

                            <!-- results -->
                            <details v-if="query.result.nb_rows > 0">
                                <summary>Result: {{query.result.nb_rows}} rows</summary>

                                <div class="table-container" v-if="!query.result.error">
                                    <table class="table is-fullwidth is-bordered data">
                                        <thead>
                                            <tr>
                                            <template v-for="col in query.result.cols">
                                                <th>{{col.name}}</th>
                                            </template>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template v-for="row in query.result.rows">
                                                <tr>
                                                    <template v-for="val in row">
                                                        <td>{{val}}</td>
                                                    </template>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </details>

                        </td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>
    
</div> <!-- app -->

<script src="static/js/socket.io.min.js" type="application/javascript"></script>
<script src="static/js/vue.global.js"></script>
<script src="static/js/app.js"></script>

</body>
</html>
